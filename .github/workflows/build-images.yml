# Builds the EnglishGoPro backend and web images and pushes them to GHCR.
#
# Runs on ubuntu-latest, which is natively linux/amd64 — the same architecture
# as the Lightsail host. No emulation, and nothing has to be installed locally.
#
# This workflow BUILDS AND PUBLISHES ONLY. It never touches the server.
# Deploying stays a deliberate manual step on the instance:
#
#     cd /home/ubuntu/englishgopro
#     IMAGE_TAG=<short-sha> docker compose pull
#     IMAGE_TAG=<short-sha> docker compose up -d
#
# The exact command, with the tag filled in, is printed in each run's summary.

name: Build and push images

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

# A newer push supersedes an in-flight build of the same ref.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # lets GITHUB_TOKEN push to GHCR — no PAT needed here

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            build_args: ''
          - name: web
            context: ./frontend
            # VITE_* values are compiled into the bundle at build time and cannot
            # be changed at runtime. If the public origin ever changes, this line
            # is what must be updated — see cloud-setup-implementation.md §2C.
            build_args: 'VITE_API_URL=https://englishgopro.com/api'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          # Keep the manifest single-platform. With provenance on, the pushed
          # artifact becomes an index carrying an extra unknown/unknown entry,
          # which makes `buildx imagetools inspect` output confusing to read.
          provenance: false
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/englishgopro-${{ matrix.name }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/englishgopro-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  summary:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Print deploy command
        run: |
          TAG="${GITHUB_SHA::7}"
          {
            echo "## Images published"
            echo ""
            echo "| Image | Tag |"
            echo "|---|---|"
            echo "| \`ghcr.io/${{ github.repository_owner }}/englishgopro-backend\` | \`$TAG\` |"
            echo "| \`ghcr.io/${{ github.repository_owner }}/englishgopro-web\` | \`$TAG\` |"
            echo ""
            echo "### Deploy (run on the Lightsail instance)"
            echo ""
            echo '```bash'
            echo "cd /home/ubuntu/englishgopro"
            echo "IMAGE_TAG=$TAG docker compose pull"
            echo "IMAGE_TAG=$TAG docker compose up -d"
            echo '```'
            echo ""
            echo "Add \`docker compose run --rm backend npx prisma migrate deploy\` if the schema changed."
          } >> "$GITHUB_STEP_SUMMARY"
