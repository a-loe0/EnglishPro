# Internal only — this listens on plain 80 *inside* the container and is never
# published to the host. TLS is terminated upstream by the incumbent stack's
# Caddy, which reverse-proxies here via the englishgopro-web network alias.

server {
    listen 80;
    server_name _;

    # Must exceed MAX_VIDEO_SIZE_MB (95). nginx defaults to 1m, which would
    # reject every video upload with a 413 long before the backend sees it.
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream uploads straight through instead of spooling the whole body to
        # disk first — the disk is shared with the incumbent stack.
        proxy_request_buffering off;

        # Transcoding and large uploads outlast the 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA fallback for react-router. Without this, a hard refresh on a client
    # route such as /teacher/dashboard returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
